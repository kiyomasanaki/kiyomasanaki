,'Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e4f6f8" font-weight="400">Strict adherence to scope, rules of engagement &amp; disclosure timelines.</tspan></text><text x="28" y="202" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#35e3ea" dominant-baseline="central">05</text><text x="62" y="202" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e4f6f8" font-weight="400">No public disclosure until the fix is deployed &amp; coordinated.</tspan></text>
