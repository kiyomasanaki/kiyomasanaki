<rect x="28" y="26" width="8" height="8" rx="1.5" fill="#5dfc8d"/>
<text x="48" y="30" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" font-weight="700" fill="#e6edf7" dominant-baseline="central" letter-spacing="0.5">DISCLOSURE POLICY — HOW I REPORT</text><text x="28" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#2ee6d6" dominant-baseline="central">01</text><text x="62" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e6edf7" font-weight="400">Reports written in English or French, per the program policy.</tspan></text><text x="28" y="106" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#2ee6d6" dominant-baseline="central">02</text><text x="62" y="106" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e6edf7" font-weight="400">Encrypted communication available via PGP.</tspan></text><text x="28" y="138" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#2ee6d6" dominant-baseline="central">03</text><text x="62" y="138" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e6edf7" font-weight="400">No exploitation beyond the minimum required for proof of concept.</tspan></text><text x="28" y="170" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#2ee6d6" dominant-baseline="central">04</text><text x="62" y="170" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e6edf7" font-weight="400">Strict adherence to scope, rules of engagement &amp; disclosure timelines.</tspan></text><text x="28" y="202" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="12.5" font-weight="700" fill="#2ee6d6" dominant-baseline="central">05</text><text x="62" y="202" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'Courier New',monospace" font-size="14" dominant-baseline="central" xml:space="preserve"><tspan fill="#e6edf7" font-weight="400">No public disclosure until the fix is deployed &amp; coordinated.</tspan></text>
</svg>
